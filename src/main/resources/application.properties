management.endpoint.health.show-details=always
# /actuator/info zeigt die deployte Version (APP_VERSION kommt aus dem Git-Tag, siehe Dockerfile/Pipeline)
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=biztrips-backend
info.app.version=${APP_VERSION:dev}

# Erlaubte Frontend-Origins (kommagetrennt). "*" = alle (lokale Entwicklung).
# Auf ECS wird per APP_CORS_ALLOWED_ORIGINS auf die Frontend-ALB-URL eingeschränkt
# (siehe task-definition.json).
app.cors.allowed-origins=*

# Bilder-Storage (/v1/images): "local" = Verzeichnis/Volume (Default, RefCard 04)
#                               "s3"    = Amazon-S3-Bucket (RefCard 05, auf ECS)
# Umschalten per Umgebungsvariablen: APP_STORAGE_TYPE=s3 APP_STORAGE_S3_BUCKET=<bucket>
# S3-Zugangsdaten stehen NICHT hier, sondern kommen aus der IAM-Rolle des ECS-Tasks.
app.storage.type=local
app.storage.local.dir=./data/images
app.storage.s3.bucket=
app.storage.s3.region=us-east-1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
