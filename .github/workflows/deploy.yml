name: CI/CD Backend Business Trips

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]            # SemVer-Release-Tags, z. B. v1.2.0
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig auf denselben ECS-Service (z. B. Push auf main + Tag-Push)
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: springboot-backend
  ECS_CLUSTER: biztripsBackend
  ECS_SERVICE: biztrips-backend-service
  CONTAINER_NAME: biztrips-backend
  ALB_NAME: refcard05-backend-alb

jobs:
  # ---------- Version aus Git-Tag ableiten ----------
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # alle Tags holen, sonst findet git describe nichts
      # v1.2.0           -> genau auf einem Release-Tag
      # v1.2.0-3-gabc1234 -> 3 Commits nach v1.2.0 (Commit abc1234)
      # 0.0.0-gabc1234   -> noch kein Tag im Repo
      - id: v
        run: |
          if VERSION=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then :; else
            VERSION="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------- CI: test → build ----------
  test:
    name: Tests ausführen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test

  build:
    name: JAR bauen
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B clean package -DskipTests

  # ---------- RefCard 05: Image nach ECR, Deployment auf ECS (Fargate) ----------
  deploy-ecs:
    name: Image nach ECR pushen und ECS-Service aktualisieren
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # AWS Academy Learner Lab: kein OIDC möglich -> temporäre Lab-Credentials als Secrets
      - name: AWS-Credentials aus Learner-Lab-Session beziehen
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lab-Session prüfen
        run: |
          aws sts get-caller-identity >/dev/null || {
            echo "::error::AWS-Credentials ungültig oder abgelaufen. Lab starten und scripts/set-aws-secrets.sh ausführen."
            exit 1
          }

      - name: Bei ECR anmelden
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Image-Tags: <version> (aus Git-Tag), <commit-sha>, latest
      - name: Image bauen und nach ECR pushen
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "image=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Task-Definition mit neuem Image aktualisieren
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: ECS-Service deployen
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # Nach dem Deploy prüfen, ob über den Load Balancer wirklich die NEUE Version antwortet
      - name: Smoke-Test (Health + Version über den ALB)
        run: |
          URL="http://$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)"
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS "$URL/actuator/health" | jq -r .status || true)
            DEPLOYED=$(curl -fsS "$URL/actuator/info" | jq -r .app.version || true)
            echo "Versuch $i: health=$HEALTH version=$DEPLOYED (erwartet $VERSION)"
            if [ "$HEALTH" = "UP" ] && [ "$DEPLOYED" = "$VERSION" ]; then
              curl -fsS "$URL/v1/trips" | jq 'length' | xargs -I{} echo "GET /v1/trips liefert {} Trips"
              echo "Smoke-Test OK: $URL läuft mit $VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend antwortet nach dem Deploy nicht mit Version $VERSION ($URL)"
          exit 1
